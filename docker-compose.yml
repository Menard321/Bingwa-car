# PHASE 8: Dockerized High-Availability Enterprise Infrastructure
# Combines Next.js 15, PHP 8.3 (OPcache/Octane), Nginx Alpine TLS 1.3,
# PostgreSQL 16 (uuid-ossp + pgcrypto + PostGIS), PgBouncer, and Redis Horizon.

services:
  nginx-gateway:
    image: nginx:1.27-alpine
    container_name: bingwa-nginx-tls
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - nextjs-showroom
      - laravel-api
    restart: unless-stopped

  nextjs-showroom:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bingwa-nextjs-showroom
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_DEFAULT_LOCALE=sw
      - NEXT_PUBLIC_CURRENCY=TZS
    ports:
      - "3000:3000"
    restart: unless-stopped

  laravel-api:
    image: php:8.3-fpm-alpine
    container_name: bingwa-laravel-octane
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
    environment:
      - APP_ENV=production
      - APP_TIMEZONE=Africa/Dar_es_Salaam
      - DB_CONNECTION=pgsql
      - DB_HOST=pgbouncer
      - DB_PORT=6432
      - DB_DATABASE=bingwa_cars_prod
      - QUEUE_CONNECTION=redis
      - REDIS_HOST=redis-horizon
    depends_on:
      - pgbouncer
      - redis-horizon
    restart: unless-stopped

  horizon-worker:
    image: php:8.3-cli-alpine
    container_name: bingwa-horizon-worker
    working_dir: /var/www/backend
    command: php artisan horizon
    volumes:
      - ./backend:/var/www/backend
    depends_on:
      - redis-horizon
      - postgres-primary
    restart: unless-stopped

  postgres-primary:
    image: postgis/postgis:16-3.4-alpine
    container_name: bingwa-postgres-16
    environment:
      POSTGRES_DB: bingwa_cars_prod
      POSTGRES_USER: bingwa_enterprise
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bingwa_secure_tz_2026}
    ports:
      - "5432:5432"
    volumes:
      - bingwa_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  pgbouncer:
    image: edoburu/pgbouncer:1.22.0
    container_name: bingwa-pgbouncer
    environment:
      DATABASE_URL: "postgres://bingwa_enterprise:${DB_PASSWORD:-bingwa_secure_tz_2026}@postgres-primary:5432/bingwa_cars_prod"
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 40
    ports:
      - "6432:5432"
    depends_on:
      - postgres-primary
    restart: unless-stopped

  redis-horizon:
    image: redis:7.4-alpine
    container_name: bingwa-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - bingwa_redisdata:/data
    restart: unless-stopped

volumes:
  bingwa_pgdata:
  bingwa_redisdata:

